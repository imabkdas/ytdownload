apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytdownload-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ytdownload-web
  template:
    metadata:
      labels:
        app: ytdownload-web
    spec:
      containers:
      - name: ytdownload-web
        image: imabkanand/ytdownload-web:latest 
        imagePullPolicy: Always 
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: ytdownload-web
spec:
  type: NodePort
  selector:
    app: ytdownload-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30000
