server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ytdownload
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:3000MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:3000MB}

# CORS configuration - use environment variable CORS_ALLOWED_ORIGINS in production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Actuator configuration for health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
